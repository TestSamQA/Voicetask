services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:?API_IMAGE is not set — add it to your .env}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__SecretKey: ${JWT_SECRET}
      AllowedOrigins: ${ALLOWED_ORIGINS}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is not set — add it to your .env}
    depends_on:
      - api

  nginx:
    image: ${NGINX_IMAGE:?NGINX_IMAGE is not set — add it to your .env}
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - api
      - web

volumes:
  postgres_data:
